name: Seed Pickyla public deployment baseline
on:
  push:
    paths:
      - ".github/workflows/seed-baseline.yml"
permissions:
  contents: write
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy deploy-ready Pickyla v17-G runtime
        run: |
          set -e
          tmp="$(mktemp -d)"
          git clone --depth 1 https://github.com/xbalancedvpn/pickleballcoaching.git "$tmp/source"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name README.md -exec rm -rf {} +
          cp -R "$tmp/source/app/." .
          rm -f CNAME
      - name: Commit deployment baseline
        run: |
          git config user.name "xbalancedvpn"
          git config user.email "56534826+xbalancedvpn@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Seed clean Pickyla v17-G deployment baseline"
          git push
